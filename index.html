<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My wedding website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Dancing+Script&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- ✅ Netlify hidden form -->
    <form name="rsvp" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="Relationship">
        <option>Bride friend</option>
        <option>Groom friend</option>
        <option>Family</option>
        <option>Other</option>
      </select>
      <input type="hidden" name="comingFor" />
    </form>

    <!-- React app root -->
    <div id="root"></div>

    <script type="module" src="src/main.jsx"></script>
  </body>
</html>
